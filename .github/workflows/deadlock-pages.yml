name: Publish Bobrs Battle Part 2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'online-deadlock/**'
      - '.github/workflows/deadlock-pages.yml'
      - 'index.html'
      - 'code/**'
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deadlock
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - run: python3 online-deadlock/build.py _site
      - run: node --test online-deadlock/rules.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
