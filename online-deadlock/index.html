<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Онлайн-драфт Deadlock для капитанов Bobbers Battle Part 3">
  <title>Bobbers Battle Part 3 · Deadlock</title>
  <!-- DEADLOCK_STYLES -->
  <link rel="stylesheet" href="online-deadlock/room.css">
</head>
<body>
  <main id="roomLobby">
    <img src="media/season/part-3-wordmark.webp" alt="Bobbers Battle Part 3">
    <h1>Драфт героев Deadlock</h1>
    <p id="roomHelp">Откройте онлайн-режим после первого драфта в Bobbers Battle Part 3 или перейдите по приглашению капитана.</p>
    <p id="lobbyStatus" role="status"></p>
  </main>
  <aside id="roomBar" hidden aria-label="Онлайн-комната">
    <p id="roomStatus" role="status" aria-live="polite"></p>
    <details id="roomInvite" hidden>
      <summary>Приглашение</summary>
      <label for="inviteUrl">Ссылка для второго капитана</label>
      <input type="url" id="inviteUrl" readonly autocomplete="off">
      <button type="button" id="copyInvite">Копировать</button>
      <p id="copyStatus" role="status"></p>
    </details>
  </aside>
  <!-- DEADLOCK_VIEW -->
  <script src="code/js/season.js"></script>
  <script src="media/season/lighting-maps.js"></script><script src="code/js/season-atmosphere.js"></script>
  <script src="media/deadlock/portraits.js"></script>
  <script src="media/season/export-preview.js"></script>
  <script src="online-deadlock/peerjs.min.js"></script>
  <script src="code/js/deadlock-draft.js"></script>
  <script src="code/js/deadlock-atmosphere.js"></script>
  <script type="module" src="online-deadlock/room.mjs"></script>
</body>
</html>
